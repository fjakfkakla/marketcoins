[package]
name = "marketcoins"
version = "0.1.0"
description = "Marketcoins · cagnotte parimutuel sur Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "marketcoins"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = "1.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
